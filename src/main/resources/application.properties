# application.properties
spring.application.name=Materio

# Base metier materio
spring.datasource.url=jdbc:postgresql://localhost:5432/materio
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# =====================================================
# Configuration Squelette Auth (base partagee gesta_auth)
# =====================================================
squelette.datasource.url=jdbc:postgresql://localhost:5432/gesta_auth
squelette.datasource.username=postgres
squelette.datasource.password=admin

# JWT Configuration
squelette.jwt.secret=PnF+n/wsQBdWcW8m8+vDU+H9xzAaV2bwPcxU54/aR8jVXdh6RbW3vx/i4wkZTdHAc8L+UgmWPHjvI15Mqm7LVw==
squelette.jwt.issuer=gesta

# Security Configuration
squelette.security.public-endpoints=/auth/**
squelette.security.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:4200

# Logging
logging.level.org.springframework.security=DEBUG

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Configuration des messages d'erreur de validation
spring.messages.basename=validation

# Activer les transactions
spring.transaction.default-timeout=30s
